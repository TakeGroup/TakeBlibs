<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>TakeBlibs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu" class="hidden">
        <div id="banner">
            <img src="banner.png" alt="" draggable="false" onerror="this.parentElement.classList.add('no-image')">
            <div class="fallback">
                <svg viewBox="0 0 24 24" width="64" height="64"><path d="M12 21.5s-6.5-6.2-6.5-11.5a6.5 6.5 0 0 1 13 0c0 5.3-6.5 11.5-6.5 11.5z" fill="none" stroke="#fff" stroke-width="1.9" stroke-linejoin="round"/><circle cx="12" cy="10" r="2.4" fill="none" stroke="#fff" stroke-width="1.9"/></svg>
                <span>TakeBlibs</span>
            </div>
        </div>

        <div id="subtitle">
            <span id="sub-text"></span>
            <span id="counter"></span>
        </div>
        <div id="items"></div>
        <div id="footer">
            <svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 10l5-5 5 5M7 14l5 5 5-5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </div>
        <div id="description" class="hidden"></div>
    </div>

    <div id="notifications"></div>

    <textarea id="clipboard"></textarea>
    <script src="script.js"></script>
</body>
</html>
